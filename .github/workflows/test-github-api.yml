name: Test GitHub Stats Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show workflow identity
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "github.repository = $GH_REPOSITORY"
          echo "github.repository_owner = $GH_LOGIN"
          echo "github.actor = $GH_ACTOR"

      - name: Run stats generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_stats.py
